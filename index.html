<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Time Game</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px;text-align:center}
main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:15px}
#game{padding:65px 15px;background:#dc2626;color:white;border-radius:12px;font-size:25px;margin:20px 0;cursor:pointer;user-select:none}
.ready{background:#16a34a!important}
button{padding:12px 20px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.stats{background:#dbeafe;padding:15px;border-radius:8px;margin-top:15px}
</style>
</head>
<body>
<main>
<h1>Reaction Time Game</h1>
<p>Wait until the box turns green, then click immediately.</p>
<div id="game">Press Start to Play</div>
<button onclick="startGame()">Start Game</button>
<div class="stats">
<p id="result">Reaction Time: --</p>
<p id="best">Best Time: --</p>
<p id="average">Average: --</p>
</div>
</main>
<script>
let state="idle",timer=null,started=0;
let scores=[];
let best=Number(localStorage.getItem("reactionBest"))||Infinity;

const game=document.getElementById("game");

function startGame(){
 clearTimeout(timer);
 state="waiting";
 game.classList.remove("ready");
 game.textContent="Wait for GREEN...";
 game.style.background="#dc2626";
 document.getElementById("result").textContent="Get ready...";
 const delay=1500+Math.random()*3500;
 timer=setTimeout(()=>{
  state="ready";
  started=performance.now();
  game.classList.add("ready");
  game.textContent="CLICK NOW!";
 },delay);
}

game.addEventListener("click",()=>{
 if(state==="waiting"){
  clearTimeout(timer);
  state="idle";
  game.classList.remove("ready");
  game.textContent="Too early! Try again.";
  document.getElementById("result").textContent="False start!";
  return;
 }

 if(state!=="ready")return;

 const reaction=Math.round(performance.now()-started);
 state="finished";
 game.classList.remove("ready");
 game.textContent="Great reaction!";

 scores.push(reaction);
 if(reaction<best){
  best=reaction;
  localStorage.setItem("reactionBest",best);
 }

 document.getElementById("result").textContent=
 "Reaction Time: "+reaction+" ms";
 document.getElementById("best").textContent=
 "Best Time: "+best+" ms";
 const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
 document.getElementById("average").textContent=
 "Session Average: "+avg+" ms";
});

if(Number.isFinite(best)){
 document.getElementById("best").textContent="Best Time: "+best+" ms";
}
</script>
</main>
</body>
</html>
