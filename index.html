<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Game</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:25px;text-align:center}
main{max-width:600px;margin:auto;background:#1e293b;padding:30px;border-radius:18px}
#game{width:100%;height:240px;background:#2563eb;color:white;border:0;border-radius:12px;font-size:25px;cursor:pointer}
#result{font-size:22px;color:#38bdf8;margin:20px}
</style>
</head>
<body>
<main>
<h1>Reaction Time Game</h1>
<p>Wait for the green signal and click as quickly as possible.</p>
<button id="game" onclick="play()">Click to Start</button>
<p id="result">Ready to play!</p>
<p id="best">Best Time: --</p>
</main>
<script>
const game=document.getElementById("game");
let state="idle",timer=null,start=0,best=Infinity;
function play(){
 const result=document.getElementById("result");
 if(state==="idle"){
  state="waiting";
  game.style.background="#dc2626";
  game.textContent="Wait for green...";
  result.textContent="Get ready!";
  timer=setTimeout(()=>{
   state="ready";
   game.style.background="#16a34a";
   game.textContent="CLICK NOW!";
   start=performance.now();
  },1500+Math.random()*3500);
 }else if(state==="waiting"){
  clearTimeout(timer);
  reset();
  result.textContent="Too early! Try again.";
 }else{
  const time=Math.round(performance.now()-start);
  best=Math.min(best,time);
  result.textContent="Reaction Time: "+time+" ms";
  document.getElementById("best").textContent="Best Time: "+best+" ms";
  reset();
 }
}
function reset(){
 state="idle";
 game.style.background="#2563eb";
 game.textContent="Play Again";
}
</script>
</body>
</html>
